[build-system]
requires = [
  "scikit-build-core",
  "pybind11"
]
build-backend = "scikit_build_core.build"

[project]
name = "hdb"
version = "0.1.3a1"
description = "Human Database"
readme = "README.md"
license = { file = "../LICENSE" }
authors = [{ name = "DPChanny", email = "kyoungchan0516@gmail.com" }]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
]
dependencies = ["sqlite-vec"]

[project.urls]
Homepage = "https://github.com/hdb-guardians/hdb"
Repository = "https://github.com/hdb-guardians/hdb"
"Bug Tracker" = "https://github.com/hdb-guardians/hdb/issues"

[dependency-groups]
dev = [
  "pybind11",
  "scikit-build-core",
    "ruff",
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-GNinja"]
sdist.include = [
  "../core/",
  "../store/",
]

[tool.scikit-build.cmake.define]
CMAKE_CXX_COMPILER = "clang++"

[tool.cibuildwheel]
build = "cp314-*"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y clang"
environment = { CMAKE_CXX_COMPILER = "clang++" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["hdb"]

[tool.ruff.format]
quote-style = "double"
